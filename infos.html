<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes infos — Semaine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">MyProg</a>
  <div class="progress-wrap" aria-label="Progression du questionnaire">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text"></span>
  </div>
</header>

<main>
  <section class="page-intro">
    <h1>Quelques infos sur toi</h1>
    <p>Pour mieux te cerner ...</p>
  </section>

  <form id="infos-form" class="infos-form alert-zone">
    <div class="field-pair">
      <div class="field-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Léo" autocomplete="given-name">
      </div>
      <div class="field-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Martin" autocomplete="family-name">
      </div>
    </div>

    <div class="field-group">
      <label for="email">Adresse mail</label>
      <input type="email" id="email" name="email" placeholder="leo.martin@email.com" autocomplete="email">
    </div>

    <div class="field-pair">
      <div class="field-group">
        <label for="naissance">Date de naissance</label>
        <input type="date" id="naissance" name="naissance" autocomplete="bday">
      </div>
      <div class="field-group">
        <label>Sexe</label>
        <div class="pill-choice">
          <label class="pill">
            <input type="radio" name="sexe" value="femme">
            <span>Femme</span>
          </label>
          <label class="pill">
            <input type="radio" name="sexe" value="homme">
            <span>Homme</span>
          </label>
          <label class="pill">
            <input type="radio" name="sexe" value="autre">
            <span>Autre</span>
          </label>
        </div>
      </div>
    </div>
  </form>

  <div class="btn-valider-container">
    <a href="planning.html" id="valider-infos" class="btn-valider">Valider</a>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
