<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niveau — Semaine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">MyProg</a>
  <div class="progress-wrap" aria-label="Progression du questionnaire">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text"></span>
  </div>
</header>

<main>
  <section class="page-intro">
    <h1>Ton niveau actuel</h1>
    <p>Cliques sur la marche qui correspond au niveau où tu joues actuellement</p>
  </section>

  <section class="pyramid-wrap">
    <div class="pyramid-row shake-only">
      <div class="pyramid-col">
        <div id="pyramid" aria-label="Sélection du niveau"></div>
        <p class="pyramid-caption">Foot à 11</p>
      </div>
      <div class="pyramid-col" id="pyramid-2-col" style="display:none;">
        <div id="pyramid-2" aria-label="Sélection du niveau (2)"></div>
        <p class="pyramid-caption">Foot à 8</p>
      </div>
    </div>
  </section>

  <section>
    <div class="btn-valider-container">
      <a href="matos.html" id="valider-niveau" class="btn-valider">Valider</a>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
