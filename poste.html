<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poste — Semaine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">Semaine</a>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="infos.html">Infos</a>

    <a href="pp.html">Préparation physique</a>
  </nav>

<main>
  <section class="page-intro">
    <h1>Ton poste</h1>
    <p>Dis nous ton poste actuel ou celui que tu voudrais jouer.</p>
  </section>

  <section class="pitch-wrap">
    <svg viewBox="0 0 400 600" id="pitch" role="group" aria-label="Terrain de football, sélection du poste">
      <!-- Terrain -->
      <rect x="10" y="10" width="380" height="580" fill="var(--pitch)" stroke="var(--card)" stroke-width="3"/>
      <line x1="10" y1="300" x2="390" y2="300" stroke="var(--card)" stroke-width="2"/>
      <circle cx="200" cy="300" r="50" fill="none" stroke="var(--card)" stroke-width="2"/>
      <circle cx="200" cy="300" r="3" fill="var(--card)"/>
      <rect x="120" y="10" width="160" height="90" fill="none" stroke="var(--card)" stroke-width="2"/>
      <rect x="120" y="500" width="160" height="90" fill="none" stroke="var(--card)" stroke-width="2"/>

      <!-- Postes -->
      <g class="poste-marker" data-poste="gardien" role="button" tabindex="0" aria-label="Gardien" aria-pressed="false">
        <circle cx="200" cy="530" r="17"/>
        <text x="200" y="560" text-anchor="middle">Gardien</text>
      </g>

      <g class="poste-marker" data-poste="lateral-droit" role="button" tabindex="0" aria-label="Latéral droit" aria-pressed="false">
        <circle cx="330" cy="450" r="17"/>
        <text x="330" y="480" text-anchor="middle">Latéral droit</text>
      </g>

      <g class="poste-marker" data-poste="lateral-gauche" role="button" tabindex="0" aria-label="Latéral gauche" aria-pressed="false">
        <circle cx="70" cy="450" r="17"/>
        <text x="70" y="480" text-anchor="middle">Latéral gauche</text>
      </g>

      <g class="poste-marker" data-poste="defenseur-central" role="button" tabindex="0" aria-label="Défenseur central" aria-pressed="false">
        <circle cx="200" cy="450" r="17"/>
        <text x="200" y="480" text-anchor="middle">Défenseur central</text>
      </g>

      <g class="poste-marker" data-poste="milieu" role="button" tabindex="0" aria-label="Milieu" aria-pressed="false">
        <circle cx="200" cy="350" r="17"/>
        <text x="200" y="380" text-anchor="middle">Milieu</text>
      </g>

      <g class="poste-marker" data-poste="ailier-droit" role="button" tabindex="0" aria-label="Ailier droit" aria-pressed="false">
        <circle cx="330" cy="250" r="17"/>
        <text x="330" y="280" text-anchor="middle">Ailier droit</text>
      </g>

      <g class="poste-marker" data-poste="ailier-gauche" role="button" tabindex="0" aria-label="Ailier gauche" aria-pressed="false">
        <circle cx="70" cy="250" r="17"/>
        <text x="70" y="280" text-anchor="middle">Ailier gauche</text>
      </g>

      <g class="poste-marker" data-poste="buteur" role="button" tabindex="0" aria-label="Buteur" aria-pressed="false">
        <circle cx="200" cy="160" r="17"/>
        <text x="200" y="190" text-anchor="middle">Buteur</text>
      </g>
    </svg>
  </section>

  <section>
    <div class="btn-valider-container">
      <a href="target.html" class="btn-valider">Valider</a>
    </div>
  </section>


</main>

<script src="script.js"></script>
</body>
</html>
